grid:
  cols: [1fr, 1fr, 2.8fr]
  rows: [auto, 1fr, auto, auto, auto, auto]   # la caja de texto absorbe el alto sobrante
  gap: 12
  padding: 24
  children:
    - { slot: 1,  at: [1,1], span: [1,2] }                  # Selector
    - { slot: 2,  at: [2,1], span: [1,2] }                  # Caja de texto
    - { slot: 3,  at: [2,2], align: end, justify: end, margin: 12 }   # Botón IA
    - { slot: 4,  at: [3,1], span: [1,2] }                  # Etiqueta
    - { slot: 5,  at: [4,1] }
    - { slot: 6,  at: [4,2] }
    - { slot: 7,  at: [5,1] }
    - { slot: 8,  at: [5,2] }
    - { slot: 9,  at: [6,1], span: [1,2] }                  # Continuar
    - { slot: 10, at: [1,3], span: [6,1], align: center, justify: center }  # Visualizador
