name: cnt_reel_studio_main_row
appearance: card
width: 100%
max_width: 800
center_horizontal: true
i18n: auto

grid:
  cols: [1fr, 1fr]
  padding: s
  gap: m
  min_width: 400
  align: stretch

  children:
    - cnt_first_draft_panel: { at: [1, 1], include: reel-studio-first-draft.layout.yaml }
    - cnt_edit_panel: { at: [1, 1], include: reel-studio-edit.layout.yaml }
    - cnt_reel_scene_viewer_slot: { at: [1, 2], justify: stretch, width: full, appearance: plain, padding: none }

timers:
  - tmr_reel_poll: { action: check_reel_status, every: 1000, enabled: false }
