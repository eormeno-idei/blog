appearance: plain
width: 100%
height: 100%
i18n: auto

grid:
  cols: [1fr]
  rows: [auto, 1fr, auto]
  padding: none
  gap: s

  children:
    - cnt_context_received_card:
        at: [1, 1]
        appearance: card
        width: full
        padding: 5
        gap: 5
        grid:
          cols: [1fr]
          gap: 5
          children:
            - lbl_context_received_title:   { text: .context_received.title }
            - lbl_context_received_content: { text: .context_received.content }
            - lbl_context_received_images:  { text: .context_received.images }

    - txt_initial_instructions:
        at: [2, 1]
        width: full

    - btn_generate_first_structure:
        at: [3, 1]
        width: full
        style: primary
        icon: "sparkles"
        action: generate_first_structure
