grid:
  cols: [1fr, 2.2fr]            # panel izquierdo ≈ 1/3, derecho ≈ 2/3
  rows: [auto, 1fr, auto]       # la caja de texto absorbe el alto sobrante
  gap: 24
  padding: 24
  children:
    - { slot: 1, at: [1,1] }                                            # Contexto recibido
    - { slot: 2, at: [2,1] }                                            # Caja de texto
    - { slot: 3, at: [3,1] }                                            # Botón generar
    - { slot: 4, at: [1,2], span: [3,1], align: center, justify: center } # Visualizador
