appearance: card
width: 100%
height: 100%
i18n: auto

grid:
  cols: [1fr]
  rows: [auto, auto, 1fr, auto]
  padding: xs
  gap: xs

  children:
    - lbl_post_title:
        at: [1, 1]
        width: full
        size: xl
        font_weight: bold

    - cnt_status_row:
        at: [2, 1]
        width: full
        appearance: elevated
        grid:
          cols: [auto, 1fr]
          gap: xs
          align: center
          children:
            - lbl_status_prefix:
                font_weight: bold
                size: small
            - lbl_status_badge:
                justify: start
                variant: pill
                style: secondary
                size: small

    - lst_history:
        at: [3, 1]
        width: full
        service: App\Services\Post\PostHistoryService
        title: .history.title
        selection_mode: single
        variant: card
        creatable: false
        editable: false
        deletable: false
        searchable: false
        show_select_all: false
        on_select: select_history_event

    - cnt_prompt_input_row:
        at: [4, 1]
        width: full
        appearance: card
        grid:
          cols: [1fr, auto]
          gap: xs
          align: center
          children:
            - input_prompt:
                width: full
                placeholder: .prompt_placeholder
            - btn_generate_reel:
                icon: send
                action: generate_reel
                style: primary
