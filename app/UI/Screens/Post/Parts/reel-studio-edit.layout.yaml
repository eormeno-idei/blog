appearance: plain
width: 100%
height: 100%
i18n: auto

grid:
  cols: [1fr]
  rows: [auto, auto, 1fr, auto]
  padding: none
  gap: m

  children:
    - lbl_post_title:
        at: [1, 1]
        width: full
        size: xl
        font_weight: bold
        text: .post_title

    - cnt_status_row:
        at: [2, 1]
        width: full

    - lst_history:
        at: [3, 1]
        width: full
        title: .history.title
        selection_mode: single
        variant: card
        creatable: false
        editable: false
        deletable: false
        searchable: false
        show_select_all: false
        on_select: select_history_event

    - cnt_waiting_creator:
        at: [4, 1]
        width: full
        appearance: card
